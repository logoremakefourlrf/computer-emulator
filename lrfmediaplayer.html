<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media Player — LRF Computer</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="mediaplayer.css"><script defer src="app.js"></script><script defer src="media.js"></script><script defer src="mediaplayer.js"></script></head><body class="app-page player-page"><header class="app-header"><a class="brand" href="index.html">◉ <span>LRF Media Player</span></a></header><main class="player-wrap"><div class="album-art"><img src="https://logoremakefourlrf.github.io/computer-emulator/start.webp" alt="LogoRemakeFour logo"><span class="art-glow"></span></div><div class="player-details"><p class="eyebrow">NOW PLAYING</p><h1 id="track-name">Choose a media file</h1><p id="track-info" class="muted">Audio and video playback</p><input id="media-file" type="file" accept="audio/*,video/*"><audio id="audio-player"></audio><div class="progress-row"><span id="elapsed">0:00</span><input id="progress" type="range" min="0" max="100" value="0" aria-label="Playback progress"><span id="duration">0:00</span></div><div class="player-controls"><button id="back-10" aria-label="Back 10 seconds">↶<small>10</small></button><button id="play-pause" class="play-button" aria-label="Play">▶</button><button id="next-10" aria-label="Forward 10 seconds">↷<small>10</small></button></div><div class="volume-row"><span>◖</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.75" aria-label="Volume"><span>🔊</span></div></div></main></body></html>
